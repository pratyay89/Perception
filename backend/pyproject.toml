[project]
name = "perception-backend"
version = "1.0.0"
description = "Backend for Perception application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21.0",
    "asyncpg>=0.31.0",
    "bcrypt>=4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.135.3",
    "groq>=1.1.2",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.26",
    "sqlalchemy>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.44.0",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "httpx>=0.28.0",
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "live: calls the real Groq API (needs GROQ_API_KEY and RUN_LIVE_LLM_TESTS=1)",
]

[tool.isort]
profile = "black"
